<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var wantsLight = stored ? stored === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
      if (wantsLight) document.documentElement.classList.add('light');
    } catch (e) {}
  })();
</script>
<script>
  // No token in this tab's session -> back to the login/menu on /admin.
  (function () {
    try {
      if (!sessionStorage.getItem('pk_admin_token')) {
        window.location.href = '../index.html';
      }
    } catch (e) {
      window.location.href = '../index.html';
    }
  })();
</script>
