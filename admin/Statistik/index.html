<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Statistiken | Pascal Krieger</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.goatcounter.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" type="image/png" href="../../Assets/logo_1x1.png">
<script src="../../theme-init.js"></script>
<script src="guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stats-page">
  <a href="../" class="admin-home-btn admin-home-btn-standalone" title="Zur Übersicht" aria-label="Zur Übersicht">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>
  </a>
  <button class="theme-toggle stats-theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Farbschema wechseln">
    <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
  </button>

  <div id="connectScreen" class="admin-login" style="display:none">
    <div class="admin-login-card">
      <p class="eyebrow">Statistiken</p>
      <h1>Mit GoatCounter verbinden</h1>
      <p class="lead">Site-Code und API-Token werden nur in diesem Browser-Tab gespeichert, nie hochgeladen. Anleitung: <code>admin/Statistik/GOATCOUNTER_SETUP.md</code>.</p>

      <label class="admin-field">
        <span>Site-Code</span>
        <input type="text" id="gcCodeInput" placeholder="z. B. pkphysio (aus pkphysio.goatcounter.com)" autocomplete="off">
      </label>
      <label class="admin-field">
        <span>API-Token</span>
        <input type="password" id="gcTokenInput" placeholder="Settings → API → Neuer Token (Berechtigung: Statistiken lesen)" autocomplete="off">
      </label>

      <button id="gcConnectBtn" class="btn btn-primary" type="button">Verbinden</button>
      <p id="gcConnectError" class="admin-error"></p>
    </div>
  </div>

  <div id="dashboardScreen" style="display:none">
    <div class="stats-inner">
      <div class="stats-head">
        <div>
          <p class="eyebrow">Statistiken</p>
          <h1>Website-Statistiken</h1>
        </div>
        <button id="gcDisconnectBtn" class="btn btn-outline" type="button">Trennen</button>
      </div>

      <p id="statsStatus" class="admin-hint">Lade Statistiken …</p>

      <div id="statsContent" hidden>
        <div id="statTiles" class="stat-tiles-grid"></div>

        <section class="stats-section">
          <h2>Seitenaufrufe – letzte 14 Tage</h2>
          <div id="trendChartWrap"></div>
        </section>

        <section class="stats-section">
          <h2>Link-Klicks – dieser Monat</h2>
          <div id="clickBreakdown"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
